<script type="text/javascript">
    RED.nodes.registerType('mcu_mcp23017', {
        category: 'MCU',
        color: '#a2aaff',
        defaults: {
            name: { value: '' },
            address: { value: '0x20', required: true },
            pin: { value: '0', required: true },
            mode: { value: 'output' },
            pollInterval: {
                value: 50,
                validate: function(v) {
                    const numeric = Number(v);
                    return Number.isFinite(numeric) && numeric >= 20;
                }
            },
            pullup: { value: false },
            sda: { value: 6, required: true },
            scl: { value: 7, required: true },
            inputs: { value: 0 },
            outputs: { value: 1 },
            moddable_manifest: {
                value: {
                    include: [
                        {
                            "git": "https://github.com/404background/node-red-mcu-mcp23017.git"
                        }
                    ]
                }
            }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-microchip',
        paletteLabel: 'MCP23017',
        outputLabels: function(index) {
            return this.mode === 'output' ? this._('mcu_mcp23017.output_label') : null;
        },
        inputLabels: function(index) {
            return this.mode === 'input' ? this._('mcu_mcp23017.input_label') : null;
        },
        label: function() {
            if (this.name) {
                return this.name;
            }
            const pin = typeof this.pin !== 'undefined' ? this.pin : '?';
            const template = this._('mcu_mcp23017.label_default');
            if (typeof template === 'string') {
                return template.replace(/\{\{\s*pin\s*\}\}/g, pin);
            }
            return `MCP23017 ${pin}`;
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            const node = this;
            const pinSelect = $('#node-input-pin');
            if (pinSelect.children().length === 0) {
                for (let i = 0; i < 16; i++) {
                    const option = $('<option></option>').val(String(i)).text(i);
                    pinSelect.append(option);
                }
            }
            // the options are added after Node-RED has populated the form,
            // so the stored pin has to be re-applied here
            pinSelect.val(String(typeof node.pin !== 'undefined' ? node.pin : 0));

            const modeSelect = $('#node-input-mode');
            const pollRow = $('.form-row[data-row="pollInterval"]');
            const pullupRow = $('.form-row[data-row="pullup"]');

            function applyMode(mode) {
                if (mode === 'input') {
                    pollRow.hide();
                    pullupRow.hide();
                } else {
                    pollRow.show();
                    pullupRow.show();
                }
            }

            if (node.mode) {
                modeSelect.val(node.mode);
            }

            modeSelect.on('change', function() {
                applyMode(modeSelect.val());
            });
            applyMode(modeSelect.val());
        },
        oneditsave: function() {
            const mode = $('#node-input-mode').val();
            this.mode = mode;
            this.__outputs = this.outputs;
            if (mode === 'input') {
                this.inputs = 1;
                this.outputs = 0;
            } else {
                this.inputs = 0;
                this.outputs = 1;
            }
        }
    });
</script>

<script type="text/html" data-template-name="mcu_mcp23017">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="mcu_mcp23017.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-address"><i class="fa fa-plug"></i> <span data-i18n="mcu_mcp23017.address"></span></label>
        <input type="text" id="node-input-address" placeholder="0x20">
    </div>
    <div class="form-row">
        <label for="node-input-pin"><i class="fa fa-thumb-tack"></i> <span data-i18n="mcu_mcp23017.pin"></span></label>
        <select id="node-input-pin"></select>
    </div>
    <div class="form-row">
        <label for="node-input-sda"><i class="fa fa-exchange"></i> <span data-i18n="mcu_mcp23017.sda"></span></label>
        <input type="number" id="node-input-sda" min="0" max="255" step="1" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-scl"><i class="fa fa-exchange"></i> <span data-i18n="mcu_mcp23017.scl"></span></label>
        <input type="number" id="node-input-scl" min="0" max="255" step="1" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-exchange"></i> <span data-i18n="mcu_mcp23017.mode"></span></label>
        <select id="node-input-mode">
            <option value="output" data-i18n="mcu_mcp23017.mode_output"></option>
            <option value="input" data-i18n="mcu_mcp23017.mode_input"></option>
        </select>
    </div>
    <div class="form-row" data-row="pollInterval">
        <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> <span data-i18n="mcu_mcp23017.pollInterval"></span></label>
        <input type="number" id="node-input-pollInterval" min="20" step="10">
    </div>
    <div class="form-row" data-row="pullup">
        <label for="node-input-pullup"><i class="fa fa-toggle-on"></i> <span data-i18n="mcu_mcp23017.pullup"></span></label>
        <input type="checkbox" id="node-input-pullup" style="width:auto;">
    </div>
</script>
