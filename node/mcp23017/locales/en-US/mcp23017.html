<script type="text/html" data-help-name="mcu_mcp23017">
  <p>
    The MCP23017 node controls a single GPIO on an MCP23017 I/O expander connected over I2C.
    It only performs I2C access when the flow runs on Node-RED MCU.
  </p>
  <p>
    <b>Input (read pin)</b>: configures the pin as an input, immediately emits the current state, then polls at the configured interval (50&nbsp;ms by default, minimum 20&nbsp;ms). Whenever the state changes, the node sends a message with the new value in <code>msg.payload</code> and mirrors the reading in the status as <code>0</code> or <code>1</code>. In this mode the node has one output and no input.
  </p>
  <p>
    <b>Output (drive pin)</b>: expects <code>msg.payload</code> to be the number <code>0</code> or <code>1</code>. Other values are ignored and reported as warnings. Valid payloads drive the selected pin and refresh the node status. In this mode the node has one input and no output.
  </p>
  <p>
    Configure the MCP23017 I2C address (<code>0x20</code> by default, the address selected with the A0-A2 pins) and pin number in the edit dialog, set the SDA/SCL pins of the board, and enable the optional pull-up resistor for monitored inputs. Pins are reserved per mode: multiple read nodes can share the same line, but mixing read and drive modes on one pin raises an error.
  </p>
</script>
