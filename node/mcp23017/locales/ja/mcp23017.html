<script type="text/html" data-help-name="mcu_mcp23017">
  <p>
    MCP23017 ノードは、I2C 接続された MCP23017 I/O エキスパンダの 1 本の GPIO を制御します。
    I2C へのアクセスは Node-RED MCU 上でフローを実行したときのみ行われます。
  </p>
  <p>
    <b>入力 (ピンを読み取り)</b>: ピンを入力として設定し、現在の状態を即座に送信した後、設定した間隔 (既定値 50&nbsp;ms、最小 20&nbsp;ms) で監視します。状態が変化するとメッセージを出力し、<code>msg.payload</code> とノードステータスに <code>0</code> または <code>1</code> を表示します。このモードでは出力が 1 つ、入力はありません。
  </p>
  <p>
    <b>出力 (ピンを駆動)</b>: <code>msg.payload</code> には <code>0</code> または <code>1</code> を指定します（<code>true</code> / <code>false</code>、文字列の <code>"0"</code> / <code>"1"</code> も受け付けます）。それ以外の値は無視され、警告として記録されます。有効な値はピンに書き込まれ、ノードステータスを更新します。このモードでは入力が 1 つ、出力はありません。
  </p>
  <p>
    編集ダイアログで MCP23017 の I2C アドレス (既定値 <code>0x20</code>、A0-A2 ピンで選択したアドレス) とピン番号を設定し、ボードの SDA/SCL ピンを指定してください。必要に応じてプルアップ抵抗を有効にできます。ピンはモードごとに予約され、読み取りモード同士であれば共有できますが、読み取りと駆動を同じピンで混在させるとエラーになります。
  </p>
</script>
